name: yaml-validate
description: >
  Two PR-time YAML checks: (1) standard yamllint syntax/style linting,
  and (2) a homelab-specific check for folded (`>`) block-scalar content
  silently swallowed into a preceding comment -- a bug class ordinary
  YAML parsing and yamllint both miss entirely, since the resulting file
  is syntactically valid the whole time. See README for the incident
  (dvystrcil/homelab#820) this was built from.

inputs:
  path:
    description: >
      Space-separated glob patterns of YAML files to check, matched by git
      against the files it tracks (`**` spans directories, including the
      root; a directory part such as `charts/**/*.yaml` is honored).
      Default: every tracked .yaml/.yml file. Untracked files are never
      linted, and a pattern list that matches nothing fails the action.
    default: "**/*.yaml **/*.yml"
  yamllint-config:
    description: >
      Path to a yamllint config file. Defaults to this action's own
      relaxed config (tuned for Kubernetes manifests -- no document-start
      requirement, generous line length). Point at your own repo's
      `.yamllint` to override.
    default: ""
  skip-yamllint:
    description: Skip the yamllint step, run only the fold-swallow check.
    default: "false"
  skip-fold-check:
    description: Skip the fold-swallow check, run only yamllint.
    default: "false"

runs:
  using: composite
  steps:
    - name: Resolve file list
      id: files
      shell: bash
      env:
        PATTERNS: ${{ inputs.path }}
      run: |
        set -euo pipefail
        # The list comes from git, not the shell: the patterns arrive through
        # env (never expanded by bash) and git matches them against the
        # tracked tree. The shell-glob version depended on the repo's layout
        # and skipped every root-level file once any subdirectory held YAML,
        # values.yaml included (dvystrcil/prometheus#66).
        if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          echo "::error::yaml-validate needs a git checkout (run actions/checkout first)"
          exit 1
        fi
        set -f
        read -ra patterns <<< "$PATTERNS"
        set +f
        specs=()
        for p in "${patterns[@]}"; do specs+=(":(glob)$p"); done
        list="$RUNNER_TEMP/yaml-validate-files.txt"
        git ls-files -z -- "${specs[@]}" > "$list"
        count=$(tr -cd '\0' < "$list" | wc -c)
        total=$(git ls-files -z -- ':(glob)**/*.yaml' ':(glob)**/*.yml' | tr -cd '\0' | wc -c)
        echo "Linting $count of $total tracked YAML file(s) (patterns: $PATTERNS)"
        if [ "$count" -eq 0 ]; then
          echo "::error::no tracked file matches '$PATTERNS'; nothing would be linted"
          exit 1
        fi
        echo "count=$count" >> "$GITHUB_OUTPUT"

    - name: yamllint
      if: inputs.skip-yamllint != 'true'
      shell: bash
      run: |
        set -euo pipefail
        # Do NOT `pip install` into the system interpreter. GitHub's
        # ubuntu-latest happens to put a hostedtoolcache Python first on
        # PATH, which is not PEP 668 marked, so a bare `pip install`
        # works there -- but on any Debian/Ubuntu system Python (notably
        # ghcr.io/catthehacker/ubuntu:act-latest, i.e. every local `act`
        # run) the same line dies with `externally-managed-environment`.
        # That made `act` useless against every repo consuming this
        # action. A venv behaves identically in both places and never
        # mutates system site-packages.
        # Always the pinned version, never whatever is on PATH: the same commit
        # must get the same verdict on every runner. Bump YAMLLINT_VERSION
        # deliberately -- a new release can add or tighten rules. Renovate opens
        # that PR (renovate.json; tests/test_renovate_tracking.py keeps the
        # annotation below in the exact shape its regex reads).
        # renovate: datasource=pypi depName=yamllint
        YAMLLINT_VERSION=1.38.0
        venv="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/yaml-validate-venv-$YAMLLINT_VERSION"
        if [ "$("$venv/bin/yamllint" --version 2>/dev/null)" != "yamllint $YAMLLINT_VERSION" ]; then
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/pip" install --quiet "yamllint==$YAMLLINT_VERSION"
        fi
        YAMLLINT="$venv/bin/yamllint"
        cfg="${{ inputs.yamllint-config }}"
        if [ -z "$cfg" ]; then
          cfg="${{ github.action_path }}/.yamllint-default.yaml"
        fi
        xargs -0 -a "$RUNNER_TEMP/yaml-validate-files.txt" "$YAMLLINT" -c "$cfg"
        echo "YAMLLINT-COMPLETE"

    - name: Fold-swallow check
      if: inputs.skip-fold-check != 'true'
      shell: bash
      run: |
        set -euo pipefail
        xargs -0 -a "$RUNNER_TEMP/yaml-validate-files.txt" python3 "${{ github.action_path }}/bin/check_fold_swallowed.py"
        echo "FOLD-CHECK-COMPLETE"
